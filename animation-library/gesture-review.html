<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sparky gesture review</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#20352f;background:#f5f7f4;font:15px/1.5 system-ui,sans-serif}main{max-width:1320px;padding:28px;margin:auto}h1{margin:0;font-size:30px}header p{margin:8px 0}a{color:#276b61}button,select{font:inherit;padding:8px 14px;border:1px solid #b9cec2;border-radius:8px;background:white;color:inherit;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid #cedbd3;border-radius:14px;overflow:hidden}.card h2{font-size:14px;margin:12px 14px 0;min-height:43px;overflow-wrap:anywhere}.card canvas{display:block;width:100%;height:300px;object-fit:contain;background:#e5eee8}.details{padding:12px 14px;font-size:13px}.details p{margin:0 0 8px}.details a{margin-right:10px}#status{font-size:13px}@media(max-width:960px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){.grid{grid-template-columns:1fr}main{padding:16px}}
</style>
<main><header><h1>Sparky gesture review</h1><p>Updated gestures at a shared size and ground anchor. Gestures play once; laugh and clap repeat.</p><a href="demo.html?animation=17-clapping">Open full animator and frame controls</a></header>
<div class="controls"><button id="restart" disabled>Replay all</button><button id="pause" disabled>Pause all</button><button id="play" disabled>Resume all</button><label for="speed">Speed</label><select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option></select><span id="status">Loading drawings…</span></div><section class="grid" id="grid"></section></main>
<script type="module">
import {SpriteSheetPlayer} from './player.js?v=breathing-v1';
const manifest=await fetch('./manifest.json',{cache:'no-store'}).then(r=>r.json());
const entries=manifest.animations.filter(e=>Number(e.id.slice(0,2))>=13&&Number(e.id.slice(0,2))<=20),players=[];
try{
 await Promise.all(entries.map(async entry=>{
  const card=document.createElement('article');card.className='card';
  const heading=document.createElement('h2');heading.textContent=entry.name;
  const canvas=document.createElement('canvas');canvas.setAttribute('aria-label',entry.name+' preview');
  const details=document.createElement('div');details.className='details';
  card.append(heading,canvas,details);document.querySelector('#grid').append(card);
  const player=await SpriteSheetPlayer.load(canvas,entry.metadata);players.push(player);
  const info=document.createElement('p');info.textContent=`${player.data.frameCount} frames · ${Math.round(player.data.durationMs)} ms · ${player.loop?'Loop':'Once, hold ending'}`;
  const open=document.createElement('a');open.href=`demo.html?animation=${entry.id}`;open.textContent='Inspect frames';
  const guide=document.createElement('a');guide.href=entry.guide;guide.textContent='Guide';
  details.append(info,open,guide);
 }));
 document.querySelector('#status').textContent=`${players.length} updated clips loaded. New drawings ready for visual review.`;
 for(const id of ['play','pause','restart'])document.querySelector('#'+id).disabled=false;
 players.forEach(p=>p.play());
}catch(error){document.querySelector('#status').textContent=error.message;}
document.querySelector('#restart').onclick=()=>players.forEach(p=>p.restart());
document.querySelector('#pause').onclick=()=>players.forEach(p=>p.pause());
document.querySelector('#play').onclick=()=>players.forEach(p=>p.play());
document.querySelector('#speed').onchange=e=>players.forEach(p=>p.setSpeed(Number(e.target.value)));
</script>
